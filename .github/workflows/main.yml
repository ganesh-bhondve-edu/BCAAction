name: Run Python Script

on: [push]

jobs:
  run-python:
    runs-on: ubuntu-latest # आपण लिनक्स किंवा विंडोज काहीही वापरू शकतो

    steps:
      - name: Code चेकिंग (Checkout)
        uses: actions/checkout@v4

      - name: Python इन्स्टॉल करणे
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python फाईल रन करणे
        run: python hello.py
